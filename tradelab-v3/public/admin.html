<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Панель управления · Демо</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.page{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
.head{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.head h1{margin:0;font-size:26px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.stats .box b{display:block;font-size:20px;margin-top:2px}.stats small{color:var(--mute)}
.invite{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.invite code{background:var(--bg);border:1px solid var(--line);padding:6px 10px;border-radius:6px;font-size:14px;overflow-wrap:anywhere}
.toolbar{display:flex;gap:8px;padding:12px;flex-wrap:wrap}.toolbar input{max-width:320px}
.pill{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.pill.blk{color:var(--down);border-color:#5a2028}
.mhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.mhead h2{margin:0;font-size:20px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;color:var(--demo);font-size:13px}
.sec{margin-top:18px}.sec h3{font-size:14px;margin:0 0 8px}
.adj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px}
.presets{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.presets button{font-size:12px}
</style>
</head>
<body>
<div class="demo-strip">Панель управления учебной платформой. Все балансы виртуальные и служат только для обучения.</div>
<header class="top">
  <a class="brand" href="/app"><i></i><span id="pname">TradeLab</span> <span class="badge">ДЕМО</span></a>
  <div class="user" style="margin-left:auto"><span id="uName"></span><span class="badge role" id="uRole"></span><a class="btn sm" href="/app">Терминал</a><a class="btn sm" href="/bots">Роботы</a><button class="btn sm" onclick="logout()">Выйти</button></div>
</header>
<main class="page">
  <div class="head"><h1 id="title">Пользователи</h1><div class="invite" id="myInvite"></div></div>
  <div class="stats" id="stats"></div>
  <div class="card">
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
</main>
<div class="modal" id="modal" hidden><div class="card" id="mbody"></div></div>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
